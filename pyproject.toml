[project]
name = "spendsift"
version = "0.1.0"
description = "Local-first personal finance manager (Paisa-class)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.32",
    "beancount>=3.0,<3.3",
    "beanquery>=0.2",
    "beangulp>=0.2",
    "pydantic>=2.12",
    "pydantic-settings>=2.6",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pyyaml>=6.0.3",
    "orjson>=3.11.5",
    "pyarrow>=24.0.0",
    "httpx>=0.28.1",
    # Round-trip YAML (comments + key order preserved) for the hand-editable
    # tax inputs file, which the UI form and the engine must read identically.
    "ruamel.yaml>=0.18.10",
    "pdfplumber>=0.11.10",
    "pypdf>=6.21.2",
    "cryptography>=50.0.2",
]

[tool.ty.environment]
python-version = "3.13"

[[tool.ty.overrides]]
include = ["tests/**"]
rules.all = "ignore"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pre-commit>=4.5.1",
    "ruff>=0.14.10",
    "ty>=0.0.10",
    "fpdf2>=2.8.9",
    "xlwt>=1.3.0",
]
