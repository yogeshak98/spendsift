# UPI payees that are payment apps or aggregators, not shops: one name -- and
# often one collective VPA (AMAZONUPI@APL, CRED.CLUB@AXISB) -- covers many
# merchants and bills, so a row of one never spreads its category and never
# learns a rule, whatever its VPA. Matched as the whole payee or its first
# words ("CRED" covers "CRED CLUB").
upi_aggregators:
  [PAYTM, BHARATPE, GOOGLE PAY, GPAY, PHONEPE, RAZORPAY, AMAZON PAY, CRED, MOBIKWIK, FREECHARGE,
   PAYU, CASHFREE, BILLDESK, CCAVENUE, INSTAMOJO, EASEBUZZ, PINE LABS, MSWIPE, MERCHANT]
